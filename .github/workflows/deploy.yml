# Build the Vite app and publish dist/ to GitHub Pages.
# Requires Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# Runs on every push to main, on demand, and once a day. The daily run first
# pulls the latest Lake Mead readings from USBR and commits them if anything
# changed (pushes made with GITHUB_TOKEN don't re-trigger this workflow).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '20 16 * * *'   # daily, ~09:20 Arizona time, after USBR posts the previous day

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Refresh Lake Mead levels from USBR
        if: github.event_name != 'push'
        id: refresh
        continue-on-error: true   # a USBR outage should not block deploying the last good snapshot
        run: node scripts/fetch_levels.mjs

      - name: Commit refreshed data
        if: github.event_name != 'push' && steps.refresh.outcome == 'success'
        run: |
          if git diff --quiet -- public/data/mead_daily.json; then
            echo "No new readings."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/mead_daily.json
            git commit -m "Refresh Lake Mead levels ($(date -u +%F))"
            git push
          fi

      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
